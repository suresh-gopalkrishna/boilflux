name: Bug report
description: Something does not work or gives wrong numbers
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or a minimal script, and the full error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: BoilFlux version and Python version
      placeholder: "boilflux 0.1.0, Python 3.12, Windows 11"
