[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quenchflux"
version = "0.1.0"
description = "Open inverse heat transfer for boiling and quenching: 3D adjoint-CGM heat-flux reconstruction from infrared thermography on moving plates."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suresh Babu Gopalkrishna" }]
keywords = [
  "inverse heat conduction", "IHCP", "quenching", "boiling", "heat flux",
  "infrared thermography", "adjoint", "conjugate gradient", "jet impingement",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24", "scipy>=1.11", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
ml = ["torch>=2.2", "h5py>=3.9", "fsspec>=2023.6", "aiohttp>=3.9", "requests>=2.31"]

[project.scripts]
quenchflux = "quenchflux.cli:main"

[project.urls]
Homepage = "https://quenchflux.github.io/quenchflux"
Documentation = "https://quenchflux.github.io/quenchflux"
Repository = "https://github.com/quenchflux/quenchflux"
Issues = "https://github.com/quenchflux/quenchflux/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]
